<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Student Education Diagnostics (SED): A Framework for Future-Ready Education</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Spectral:wght@500;600&amp;family=Plus+Jakarta+Sans:wght@400;500;600;700;800&amp;display=swap"
    />
    <link rel="stylesheet" href="css/styles.css" />
  </head>
  <body>
    <div id="app">
      <header>
        <span class="plate"
          ><img
            src="assets/logo.png"
            alt="Student Education Diagnostics logo: Neuroscience Based Learning Tools"
        /></span>
        <div class="ctl" role="toolbar" aria-label="Presenter controls">
          <span id="count" aria-live="polite"></span>
          <button id="bPrev" aria-label="Previous stage">‹ Back</button>
          <button id="bNext" aria-label="Next stage">Next ›</button>
          <button id="bRe" class="opt" aria-label="Replay this stage">Replay</button>
          <button id="bSrc" class="opt" aria-pressed="false" aria-controls="panel">Contact</button>
          <button id="bFs" class="opt" aria-label="Toggle fullscreen">Fullscreen</button>
          <button id="bRst" aria-label="Restart presentation">Restart</button>
        </div>
      </header>
      <nav id="journey" aria-label="Presentation stages"></nav>
      <main id="stage" aria-live="polite"></main>
      <footer>
        <!-- YOUR FOOTER: edit the text below, or delete this whole <footer> block. -->
        <span class="footer-text">Student Education Diagnostics · Understanding Every Learner. Empowering Every Future.</span>
        <span id="srcline" hidden></span>
      </footer>
      <aside id="panel" aria-label="Source references"></aside>
      <aside id="brief" class="brief" role="dialog" aria-live="polite"></aside>
    </div>
    <script src="js/content.js"></script>
    <script src="js/app.js"></script>
  </body>
</html>
